# Buildkite pipeline for spinel — https://buildkite.com/kyoto/spinel
#
# Mirrors .github/workflows/ci.yml on Buildkite hosted agents, fanning the
# 950-fixture suite across parallel shards so it finishes faster than GHA:
#   • macOS / clang  — build + suite                      (queue=macos, 6 vCPU)
#   • Linux / gcc    — build + suite + optcarrot + bench  (queue=linux, 4 vCPU)
#
# Clang coverage comes from the macOS track. A Linux/clang track is deferred:
# clang isn't on the Linux hosted image (only gcc), so it'd need a custom agent
# image. bench rides the gcc job here — its output is deterministic across
# compilers (ci.yml only put it on clang to balance the two Ubuntu jobs).
#
# Explicit keyed build steps (not a build matrix): a matrix can't set per-combo
# keys, which means downstream steps can only depend on the whole matrix — in
# build #9 one failed compiler dragged down the tracks that had already passed.
# Keyed builds let each track's tests depend on just their own build and scope
# the artifact download with --step (all builds publish the same two filenames).
#
# The two tracks run concurrently on separate queues, so wall-clock ≈ the slower
# track, not the sum. The remaining tax is hosted cold-start (~10s to provision
# a fresh VM per phase); set a minimum warm-agent count on each queue to beat
# GHA reliably.
#
# OPT is intentionally NOT set globally: run-tests defaults to -O1 (compiles the
# sp_runtime.h-heavy per-test C ~3x faster), while bench/optcarrot inherit the
# Makefile default -O2 — exactly like ci.yml, which sets OPT=-O1 only on tests.

steps:
  # ===================== macOS / clang =====================
  - label: ":mac: build"
    key: "build-macos"
    agents:
      queue: "macos"
    command:
      - "make deps"
      - "make -j\"$$(getconf _NPROCESSORS_ONLN)\" LTO=0 all"
      - "make rbs-test rbs-seed-test"
    artifact_paths:
      - "bin/spinel"
      - "lib/libspinel_rt.a"

  - label: ":mac: tests %n"
    key: "tests-macos"
    depends_on: "build-macos"
    agents:
      queue: "macos"
    parallelism: 8
    command:
      - "buildkite-agent artifact download bin/spinel . --step build-macos"
      - "buildkite-agent artifact download lib/libspinel_rt.a . --step build-macos"
      - "chmod +x bin/spinel"
      - "ruby -v"
      - ".buildkite/run-tests --slice"

  # ===================== Linux / gcc (carries optcarrot + bench) ===========
  - label: ":linux: build (gcc)"
    key: "build-linux-gcc"
    agents:
      queue: "linux"
    env:
      CC: "gcc"
    command:
      - "make deps"
      - "make -j\"$$(getconf _NPROCESSORS_ONLN)\" LTO=0 all"
      - "make rbs-test rbs-seed-test"
    artifact_paths:
      - "bin/spinel"
      - "lib/libspinel_rt.a"

  - label: ":linux: tests gcc %n"
    key: "tests-linux-gcc"
    depends_on: "build-linux-gcc"
    agents:
      queue: "linux"
    env:
      CC: "gcc"
    parallelism: 8
    command:
      - "buildkite-agent artifact download bin/spinel . --step build-linux-gcc"
      - "buildkite-agent artifact download lib/libspinel_rt.a . --step build-linux-gcc"
      - "chmod +x bin/spinel"
      - "ruby -v"
      - ".buildkite/run-tests --slice"

  - label: ":linux: optcarrot (gcc)"
    key: "optcarrot"
    depends_on: "build-linux-gcc"
    agents:
      queue: "linux"
    env:
      CC: "gcc"
    command:
      - "buildkite-agent artifact download bin/spinel . --step build-linux-gcc"
      - "buildkite-agent artifact download lib/libspinel_rt.a . --step build-linux-gcc"
      - "chmod +x bin/spinel"
      - "make -o bin/spinel -o lib/libspinel_rt.a optcarrot"

  - label: ":linux: bench (gcc)"
    key: "bench"
    depends_on: "build-linux-gcc"
    agents:
      queue: "linux"
    env:
      CC: "gcc"
    command:
      - "buildkite-agent artifact download bin/spinel . --step build-linux-gcc"
      - "buildkite-agent artifact download lib/libspinel_rt.a . --step build-linux-gcc"
      - "chmod +x bin/spinel"
      - "make -o bin/spinel -o lib/libspinel_rt.a bench"
