# Buildkite pipeline for spinel — https://buildkite.com/kyoto/spinel
#
# Shape: build the compiler once, then run the ~950 test/*.rb golden-diff
# fixtures split across N parallel jobs. This mirrors the macOS/clang job in
# .github/workflows/ci.yml (deps -> all -> test), but distributes the
# per-fixture compile+run work that dominates `make test`.
#
# Runs on Buildkite hosted macOS agents (queue=macos): each job gets its own
# fresh 6-vCPU machine that is torn down afterward, so the test shards run on
# separate machines with no core contention — which is exactly where the
# build-once / fan-out split pays off. sccache is intentionally NOT used here:
# the local disk cache is wiped between ephemeral builds, so it can never hit.

agents:
  # macos is the default queue of the "Hosted" cluster, so the bootstrap
  # :pipeline: upload step lands here too without extra targeting.
  queue: "macos"

env:
  # -O1 compiles each generated test ~3x faster than -O0 (see Makefile); the
  # wrapper reads this and passes it through to `make`.
  OPT: "-O1"

steps:
  - label: ":hammer_and_wrench: build compiler"
    key: "build"
    command:
      - "make deps"
      - "make -j\"$$(getconf _NPROCESSORS_ONLN)\" LTO=0 all"
      # Cheap C-only golden checks — run once here rather than on every shard.
      - "make rbs-test rbs-seed-test"
    artifact_paths:
      - "bin/spinel"
      - "lib/libspinel_rt.a"

  - wait: ~

  - label: ":test_tube: tests %n"
    key: "tests"
    depends_on: "build"
    # Each shard is its own hosted machine, so raise this freely. ~950 fixtures
    # / 8 ≈ 120 per shard; the per-shard floor is checkout + the two artifact
    # downloads (~6s). Higher = faster wall, but more agent-minutes billed.
    parallelism: 8
    command:
      - "buildkite-agent artifact download bin/spinel ."
      - "buildkite-agent artifact download lib/libspinel_rt.a ."
      - "chmod +x bin/spinel"
      # ~101 fixtures have no committed .expected and regenerate it via `ruby`
      # (Makefile's REF_RUBY). Print the image's Ruby so we can pin it (GHA
      # uses 3.4) if those fixtures diverge.
      - "ruby -v"
      - ".buildkite/run-tests --slice"
