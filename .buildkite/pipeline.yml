# Buildkite pipeline for spinel — https://buildkite.com/kyoto/spinel
#
# Mirrors the push lanes of .github/workflows/ci.yml on Buildkite hosted
# agents, fanning the ~4500-fixture corpus across parallel shards:
#   • macOS / clang       — make test                       (queue=macos, native)
#   • Linux / gcc         — make test + gates + scale-test + bench + optcarrot
#   • Linux / clang       — make test
#   • Linux / gcc -m32    — make test-corpus at -Og
#   • wasm32-wasi         — make wasm-test
# Linux steps run in the public `ruby:4.0` image (ci.yml's Ruby; Debian with
# gcc + make + curl). The image has no clang or 32-bit toolchain, so those
# tracks install them via .buildkite/ensure-clang / ensure-m32 — cheap because
# the container runs as root. macOS runs natively; .buildkite/ensure-coreutils
# guarantees a `timeout`, without which every fixture runs with no time limit.
#
# `make test` is the corpus plus the C-side legs test-run lists (rbs, rejection,
# GC, threading, extension tests). Each track splits it in two:
#   • a build step that publishes the compiler + runtimes, and shards that run
#     the corpus against them with make's own TEST_SHARD=k/n (.buildkite/run-tests);
#   • a legs step that builds its own tree and runs test-run with the corpus
#     emptied (TESTS= PKG_TESTS=), so the legs track whatever test-run lists.
# The legs step does not wait on the build, so the legs never delay the shards.
#
# Explicit keyed builds (not a build matrix): a matrix can't set per-combo keys,
# so downstream steps could only depend on the whole matrix — in build #9 one
# failed compiler dragged down tracks that had already passed. Keyed builds let
# each track's tests depend on just their own build and scope the artifact
# download with --step (all builds publish the same filenames).
#
# Hosted agent CONCURRENCY is the binding constraint: builds #13-15 showed the
# linux queue serving ~10 jobs at once and macos ~4. The shard counts are a
# first cut for the ~4500-fixture corpus and want a re-tune from real timings.
#
# OPT mirrors ci.yml: gcc tests run at -O1 (run-tests' default), clang at -O0
# (-O1 is ~2.5x SLOWER for clang on the spinel_rt.h-heavy TUs), -m32 at -Og.
# bench/optcarrot take the Makefile default -O2, as in ci.yml.

steps:
  # ===================== macOS / clang (native Ruby) =======================
  - label: ":mac: build"
    key: "build-macos"
    agents:
      queue: "macos"
    command:
      - ".buildkite/ensure-coreutils"
      - "make deps"
      - "make -j\"$$(getconf _NPROCESSORS_ONLN)\" all"
    artifact_paths:
      - "bin/spinel"
      - "lib/libspinel_rt.a"
      # A threaded fixture links the -DSP_THREADS runtime and the _mt package
      # objects; shipping them keeps the shards from rebuilding the MT runtime.
      - "lib/libspinel_rt_mt.a"
      - "packages/*/*.o"

  - label: ":mac: legs"
    key: "legs-macos"
    agents:
      queue: "macos"
    command:
      - ".buildkite/ensure-coreutils"
      - "make deps"
      - "make -j\"$$(getconf _NPROCESSORS_ONLN)\" all"
      # -o skips backtrace-test. The hosted image is macOS 14, where a rescued
      # backtrace comes out with no frames (with Xcode 15.4 and 16.3 alike);
      # ci.yml's macos-latest is macOS 26, where it passes. Drop the -o once the
      # queue runs a newer macOS.
      - "make -j\"$$(getconf _NPROCESSORS_ONLN)\" -o backtrace-test test-run TESTS= PKG_TESTS= OPT=-O0"

  - label: ":mac: tests %n"
    key: "tests-macos"
    depends_on: "build-macos"
    agents:
      queue: "macos"
    env:
      # ci.yml sets -O0 for every clang lane, macOS included. Apple clang 15 at
      # -O1 miscompiles subclass_inherits_module_parent and bundle_classd_46.
      OPT: "-O0"
    # The legs step holds one of the ~4 macos slots.
    parallelism: 3
    command:
      - ".buildkite/ensure-coreutils"
      - "buildkite-agent artifact download bin/spinel . --step build-macos"
      - "buildkite-agent artifact download lib/libspinel_rt.a . --step build-macos"
      - "buildkite-agent artifact download lib/libspinel_rt_mt.a . --step build-macos"
      - "buildkite-agent artifact download 'packages/*/*.o' . --step build-macos"
      - "chmod +x bin/spinel"
      - ".buildkite/run-tests --slice"

  # ============ Linux / gcc — carries the gates, bench and optcarrot =========
  - label: ":linux: build (gcc)"
    key: "build-linux-gcc"
    image: "ruby:4.0"
    agents:
      queue: "linux"
    env:
      CC: "gcc"
    command:
      - "make deps"
      - "make -j\"$$(getconf _NPROCESSORS_ONLN)\" all"
    artifact_paths:
      - "bin/spinel"
      - "lib/libspinel_rt.a"
      - "lib/libspinel_rt_mt.a"
      - "packages/*/*.o"

  - label: ":linux: legs (gcc)"
    key: "legs-linux-gcc"
    image: "ruby:4.0"
    agents:
      queue: "linux"
    env:
      CC: "gcc"
    command:
      - ".buildkite/as-user make deps"
      - ".buildkite/as-user make -j\"$$(getconf _NPROCESSORS_ONLN)\" all"
      - ".buildkite/as-user make -j\"$$(getconf _NPROCESSORS_ONLN)\" test-run TESTS= PKG_TESTS= OPT=-O1"

  # The gates assert the SHAPE of the generated C — that a slot keeps its typed
  # representation, that the alloc report keeps its format — which the output
  # diffs cannot see. scale-test is the front end's work ratio between a program
  # and one four times its size. Both, like optcarrot, are Linux/gcc singles in
  # ci.yml. They run beside the legs, not after them: in one step the two took
  # 5m34s (build #54).
  - label: ":linux: gates + scale-test + optcarrot (gcc)"
    key: "gates-linux-gcc"
    image: "ruby:4.0"
    agents:
      queue: "linux"
    env:
      CC: "gcc"
    command:
      - ".buildkite/as-user make deps"
      - ".buildkite/as-user make -j\"$$(getconf _NPROCESSORS_ONLN)\" all build/spinel-work"
      - ".buildkite/as-user make -j\"$$(getconf _NPROCESSORS_ONLN)\" alloc-report-test infer-test spin-check"
      - ".buildkite/as-user make scale-test"
      - ".buildkite/as-user make optcarrot"

  - label: ":linux: tests gcc %n"
    key: "tests-linux-gcc"
    depends_on: "build-linux-gcc"
    image: "ruby:4.0"
    agents:
      queue: "linux"
    env:
      CC: "gcc"
    # gcc compiles the per-test TUs faster than clang, so it gets fewer shards.
    parallelism: 3
    command:
      - "buildkite-agent artifact download bin/spinel . --step build-linux-gcc"
      - "buildkite-agent artifact download lib/libspinel_rt.a . --step build-linux-gcc"
      - "buildkite-agent artifact download lib/libspinel_rt_mt.a . --step build-linux-gcc"
      - "buildkite-agent artifact download 'packages/*/*.o' . --step build-linux-gcc"
      - "chmod +x bin/spinel"
      - ".buildkite/as-user .buildkite/run-tests --slice"

  - label: ":linux: bench (gcc) %n"
    key: "bench"
    depends_on: "build-linux-gcc"
    image: "ruby:4.0"
    agents:
      queue: "linux"
    env:
      CC: "gcc"
    parallelism: 2
    command:
      - "buildkite-agent artifact download bin/spinel . --step build-linux-gcc"
      - "buildkite-agent artifact download lib/libspinel_rt.a . --step build-linux-gcc"
      - "buildkite-agent artifact download lib/libspinel_rt_mt.a . --step build-linux-gcc"
      - "buildkite-agent artifact download 'packages/*/*.o' . --step build-linux-gcc"
      - "chmod +x bin/spinel"
      - ".buildkite/as-user .buildkite/run-bench --slice"

  # ===================== Linux / clang (ruby:4.0 + clang) ==================
  - label: ":linux: build (clang)"
    key: "build-linux-clang"
    image: "ruby:4.0"
    agents:
      queue: "linux"
    env:
      CC: "clang"
    command:
      - ".buildkite/ensure-clang"
      - "make deps"
      - "make -j\"$$(getconf _NPROCESSORS_ONLN)\" all"
    artifact_paths:
      - "bin/spinel"
      - "lib/libspinel_rt.a"
      - "lib/libspinel_rt_mt.a"
      - "packages/*/*.o"

  - label: ":linux: legs (clang)"
    key: "legs-linux-clang"
    image: "ruby:4.0"
    agents:
      queue: "linux"
    env:
      CC: "clang"
    command:
      - ".buildkite/ensure-clang"
      - ".buildkite/as-user make deps"
      - ".buildkite/as-user make -j\"$$(getconf _NPROCESSORS_ONLN)\" all"
      - ".buildkite/as-user make -j\"$$(getconf _NPROCESSORS_ONLN)\" test-run TESTS= PKG_TESTS= OPT=-O0"

  - label: ":linux: tests clang %n"
    key: "tests-linux-clang"
    depends_on: "build-linux-clang"
    image: "ruby:4.0"
    agents:
      queue: "linux"
    env:
      CC: "clang"
      OPT: "-O0"
    parallelism: 4
    command:
      - "buildkite-agent artifact download bin/spinel . --step build-linux-clang"
      - "buildkite-agent artifact download lib/libspinel_rt.a . --step build-linux-clang"
      - "buildkite-agent artifact download lib/libspinel_rt_mt.a . --step build-linux-clang"
      - "buildkite-agent artifact download 'packages/*/*.o' . --step build-linux-clang"
      - "chmod +x bin/spinel"
      - ".buildkite/ensure-clang"
      - ".buildkite/as-user .buildkite/run-tests --slice"

  # ===================== Linux / gcc -m32 (ruby:4.0 + multilib) ============
  # sp_int is the pointer width, so -m32 is where the runtime's and emitters'
  # word-size assumptions are exercised. Corpus only, as in ci.yml: the C-side
  # legs have no 32-bit toolchain to build against, and an `# spinel: int64`
  # fixture drops out on its own (SPINEL_INT_BITS, probed from CC).
  - label: ":linux: build (gcc -m32)"
    key: "build-linux-m32"
    image: "ruby:4.0"
    agents:
      queue: "linux"
    env:
      CC: "gcc -m32"
    command:
      - ".buildkite/ensure-m32"
      - "make deps"
      - "make -j\"$$(getconf _NPROCESSORS_ONLN)\" all"
    artifact_paths:
      - "bin/spinel"
      - "lib/libspinel_rt.a"
      - "lib/libspinel_rt_mt.a"
      - "packages/*/*.o"

  - label: ":linux: tests gcc -m32 %n"
    key: "tests-linux-m32"
    depends_on: "build-linux-m32"
    image: "ruby:4.0"
    agents:
      queue: "linux"
    env:
      CC: "gcc -m32"
      # ci.yml: -Og ran the 32-bit corpus in 164 s where -O1 took 246 s.
      OPT: "-Og"
    parallelism: 3
    command:
      - ".buildkite/ensure-m32"
      - "buildkite-agent artifact download bin/spinel . --step build-linux-m32"
      - "buildkite-agent artifact download lib/libspinel_rt.a . --step build-linux-m32"
      - "buildkite-agent artifact download lib/libspinel_rt_mt.a . --step build-linux-m32"
      - "buildkite-agent artifact download 'packages/*/*.o' . --step build-linux-m32"
      - "chmod +x bin/spinel"
      - ".buildkite/as-user .buildkite/run-tests --slice"

  # ===================== wasm32-wasi (ruby:4.0 + wasi-sdk + wasmtime) ======
  # Builds a few corpus programs for wasm32-wasi and runs them under wasmtime;
  # a POSIX function lib/wasi declares but sp_wasi.c never defines shows up here
  # as a link error. WASM_ENGINE_REQUIRED makes a missing engine fail, not skip.
  - label: ":linux: wasm32-wasi"
    key: "wasm"
    image: "ruby:4.0"
    agents:
      queue: "linux"
    env:
      # The versions ci.yml pins (docs/wasm.md).
      WASI_SDK_VERSION: "34"
      WASMTIME_VERSION: "49.0.0"
      WASI_SDK_PATH: "/opt/wasi-sdk"
    command:
      - ".buildkite/ensure-wasm"
      - "make deps"
      - "make -j\"$$(getconf _NPROCESSORS_ONLN)\" all"
      - "make -j\"$$(getconf _NPROCESSORS_ONLN)\" wasm-test WASM_ENGINE_REQUIRED=1"
