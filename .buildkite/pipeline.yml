# Buildkite pipeline for spinel — https://buildkite.com/kyoto/spinel
#
# Mirrors .github/workflows/ci.yml on Buildkite hosted agents, fanning the
# ~3340-fixture suite across parallel shards so it finishes faster than GHA:
#   • macOS / clang  — build + suite                      (queue=macos, native)
#   • Linux / gcc    — build + suite + gates + bench      (queue=linux, image: ruby)
#   • Linux / clang  — build + suite                      (queue=linux, image: ruby)
# Running the suite under gcc and clang is real coverage — clang -Werror trips on
# discarded statement-exprs gcc ignores (Makefile's TEST_WARN_SUPPRESS).
# The gcc track carries bench, optcarrot and the property gates, matching
# ci.yml: its test leg is the cheaper of the two, so loading it there keeps the
# clang suite the only thing setting the wall time.
#
# Linux steps run inside the public `ruby` container image (buildpack-deps-based:
# Ruby + gcc + make + curl). The ruby image has no clang, so the clang track
# `apt-get install`s it via .buildkite/ensure-clang — cheap because the container
# runs as root (no sudo). macOS runs natively (its hosted image ships Ruby+clang),
# but not necessarily coreutils: .buildkite/ensure-coreutils guarantees a
# `timeout`, without which every fixture would run with no time limit.
#
# Explicit keyed builds (not a build matrix): a matrix can't set per-combo keys,
# so downstream steps could only depend on the whole matrix — in build #9 one
# failed compiler dragged down tracks that had already passed. Keyed builds let
# each track's tests depend on just their own build and scope the artifact
# download with --step (all builds publish the same filenames).
#
# Tracks run concurrently on separate queues, so wall-clock ≈ the slowest track.
# The binding constraint is hosted agent CONCURRENCY: builds #13-15 showed the
# linux queue serving ~10 jobs at once and macos ~4, the rest queuing 25-50s.
# Past that cap, more shards only add waves — so parallelism is right-sized to
# land every shard in ONE wave (linux test phase: 3 gcc + 4 clang + 2 bench +
# gates = 10; macos: 4).
#
# Those shard counts were last tuned when the suite was 950 fixtures; it is now
# ~3340, so bench (61 programs, ~64s serial) gave up a slot to the test shards
# that now set the wall time. The split is still due a re-tune against real
# timings from the first green build on this suite.
#
# OPT mirrors ci.yml, which learned the two compilers behave oppositely on the
# spinel_rt.h-heavy per-test TUs: gcc prunes unreferenced statics before codegen
# so -O1 is far faster than -O0, while clang runs the full optimizer over every
# emitted inline static so -O1 is ~2.5x SLOWER. gcc tests therefore run at -O1
# (run-tests' default) and clang tests at -O0 -- BOTH clang tracks, macOS
# included. bench/optcarrot take the Makefile default -O2, exactly like ci.yml,
# which sets OPT only on the test step.

steps:
  # ===================== macOS / clang (native Ruby) =======================
  - label: ":mac: build"
    key: "build-macos"
    agents:
      queue: "macos"
    command:
      - ".buildkite/ensure-coreutils"
      - "make deps"
      - "make -j\"$$(getconf _NPROCESSORS_ONLN)\" all"
      # The sub-gates `make test` runs alongside the fixtures. run-tests builds
      # the .ok targets directly, so it bypasses them; run them once per track.
      - "make rbs-test rbs-seed-test re-lit-test reject-test"
    artifact_paths:
      - "bin/spinel"
      - "lib/libspinel_rt.a"
      # A threaded fixture links the -DSP_THREADS runtime and the _mt package
      # objects; shipping them keeps the shards from rebuilding the MT runtime.
      - "lib/libspinel_rt_mt.a"
      - "packages/*/*.o"

  - label: ":mac: tests %n"
    key: "tests-macos"
    depends_on: "build-macos"
    agents:
      queue: "macos"
    env:
      # macOS is a CLANG track, so it takes ci.yml's clang opt level like the
      # Linux clang shards do. This step ran at run-tests' -O1 default, which
      # is a clang+-O1 pairing ci.yml never exercises: on the agent's Apple
      # clang 15, subclass_inherits_module_parent and bundle_classd_46 build a
      # binary that reads an inherited ivar as nil. Same agent, same artifacts,
      # -O0 vs -O1: 2 pass vs 2 fail (build #43). The generated C is
      # byte-identical to a local build's, so this is the C compiler, not spinel.
      OPT: "-O0"
    # macos queue serves ~4 at once (builds #14-15 each stranded one shard at 5).
    parallelism: 4
    command:
      - ".buildkite/ensure-coreutils"
      - "buildkite-agent artifact download bin/spinel . --step build-macos"
      - "buildkite-agent artifact download lib/libspinel_rt.a . --step build-macos"
      - "buildkite-agent artifact download lib/libspinel_rt_mt.a . --step build-macos"
      - "buildkite-agent artifact download 'packages/*/*.o' . --step build-macos"
      - "chmod +x bin/spinel"
      - ".buildkite/run-tests --slice"

  # ============ Linux / gcc (image: ruby) — carries bench + gates ==========
  - label: ":linux: build (gcc)"
    key: "build-linux-gcc"
    image: "ruby"
    agents:
      queue: "linux"
    env:
      CC: "gcc"
    command:
      - "make deps"
      - "make -j\"$$(getconf _NPROCESSORS_ONLN)\" all"
      - "make rbs-test rbs-seed-test re-lit-test reject-test"
    artifact_paths:
      - "bin/spinel"
      - "lib/libspinel_rt.a"
      # A threaded fixture links the -DSP_THREADS runtime and the _mt package
      # objects; shipping them keeps the shards from rebuilding the MT runtime.
      - "lib/libspinel_rt_mt.a"
      - "packages/*/*.o"
      # spin-check runs bin/spin, which resolves --rbs seeds through
      # spinel_rbs_extract staged beside it; without that copy it loses them.
      - "bin/spin"
      - "bin/spinel_rbs_extract"

  - label: ":linux: tests gcc %n"
    key: "tests-linux-gcc"
    depends_on: "build-linux-gcc"
    image: "ruby"
    agents:
      queue: "linux"
    env:
      CC: "gcc"
    # Right-sized so gcc + clang + bench + gates fit one linux wave (~10).
    # gcc gets one shard fewer than clang: it compiles the per-test TUs faster,
    # so an even split would leave the gcc shards idle waiting on clang.
    parallelism: 3
    command:
      - "buildkite-agent artifact download bin/spinel . --step build-linux-gcc"
      - "buildkite-agent artifact download lib/libspinel_rt.a . --step build-linux-gcc"
      - "buildkite-agent artifact download lib/libspinel_rt_mt.a . --step build-linux-gcc"
      - "buildkite-agent artifact download 'packages/*/*.o' . --step build-linux-gcc"
      - "chmod +x bin/spinel"
      - ".buildkite/run-tests --slice"

  # optcarrot and the property gates share a step: both are Linux/gcc singles
  # off the same build, and one step keeps the linux test phase at 10 jobs.
  # The gates assert the SHAPE of the generated C — that a slot keeps its typed
  # representation, that the alloc report keeps its format — which the output
  # diffs cannot see, since a boxed hash still prints the right answer.
  - label: ":linux: gates (gcc)"
    key: "gates"
    depends_on: "build-linux-gcc"
    image: "ruby"
    agents:
      queue: "linux"
    env:
      CC: "gcc"
    command:
      - "buildkite-agent artifact download bin/spinel . --step build-linux-gcc"
      - "buildkite-agent artifact download lib/libspinel_rt.a . --step build-linux-gcc"
      - "buildkite-agent artifact download lib/libspinel_rt_mt.a . --step build-linux-gcc"
      - "buildkite-agent artifact download 'packages/*/*.o' . --step build-linux-gcc"
      - "buildkite-agent artifact download bin/spin . --step build-linux-gcc"
      - "buildkite-agent artifact download bin/spinel_rbs_extract . --step build-linux-gcc"
      - "chmod +x bin/spinel bin/spin bin/spinel_rbs_extract"
      - "make -o bin/spinel -o lib/libspinel_rt.a -o bin/spin optcarrot alloc-report-test infer-test spin-check"

  - label: ":linux: bench (gcc) %n"
    key: "bench"
    depends_on: "build-linux-gcc"
    image: "ruby"
    agents:
      queue: "linux"
    env:
      CC: "gcc"
    # 61 benchmarks, ~64s serial. Two shards put it well under the test shards,
    # which is all that is needed now that they, not bench, set the wall time.
    parallelism: 2
    command:
      - "buildkite-agent artifact download bin/spinel . --step build-linux-gcc"
      - "buildkite-agent artifact download lib/libspinel_rt.a . --step build-linux-gcc"
      - "buildkite-agent artifact download lib/libspinel_rt_mt.a . --step build-linux-gcc"
      - "buildkite-agent artifact download 'packages/*/*.o' . --step build-linux-gcc"
      - "chmod +x bin/spinel"
      - ".buildkite/run-bench --slice"

  # ===================== Linux / clang (image: ruby + clang) ===============
  - label: ":linux: build (clang)"
    key: "build-linux-clang"
    image: "ruby"
    agents:
      queue: "linux"
    env:
      CC: "clang"
    command:
      - ".buildkite/ensure-clang"
      - "make deps"
      - "make -j\"$$(getconf _NPROCESSORS_ONLN)\" all"
      - "make rbs-test rbs-seed-test re-lit-test reject-test"
    artifact_paths:
      - "bin/spinel"
      - "lib/libspinel_rt.a"
      # A threaded fixture links the -DSP_THREADS runtime and the _mt package
      # objects; shipping them keeps the shards from rebuilding the MT runtime.
      - "lib/libspinel_rt_mt.a"
      - "packages/*/*.o"

  - label: ":linux: tests clang %n"
    key: "tests-linux-clang"
    depends_on: "build-linux-clang"
    image: "ruby"
    agents:
      queue: "linux"
    env:
      CC: "clang"
      # clang keeps the full optimizer on every emitted inline static, so -O1
      # compiles the per-test TUs ~2.5x slower than -O0 (ci.yml's measurement).
      OPT: "-O0"
    # Right-sized so gcc + clang + bench + gates fit one linux wave (~10).
    parallelism: 4
    command:
      - "buildkite-agent artifact download bin/spinel . --step build-linux-clang"
      - "buildkite-agent artifact download lib/libspinel_rt.a . --step build-linux-clang"
      - "buildkite-agent artifact download lib/libspinel_rt_mt.a . --step build-linux-clang"
      - "buildkite-agent artifact download 'packages/*/*.o' . --step build-linux-clang"
      - "chmod +x bin/spinel"
      - ".buildkite/ensure-clang"
      - ".buildkite/run-tests --slice"
