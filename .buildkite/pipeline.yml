# Buildkite pipeline for spinel — https://buildkite.com/kyoto/spinel
#
# Mirrors .github/workflows/ci.yml on Buildkite hosted agents, fanning the
# 950-fixture suite across parallel shards so it finishes faster than GHA:
#   • macOS / clang  — build + suite              (queue=macos, 6 vCPU, native)
#   • Linux / gcc    — build + suite + optcarrot  (queue=linux, 4 vCPU, image: ruby)
#   • Linux / clang  — build + suite + bench      (queue=linux, 4 vCPU, image: ruby)
# Running the suite under gcc and clang is real coverage — clang -Werror trips on
# discarded statement-exprs gcc ignores (Makefile's TEST_WARN_SUPPRESS).
# optcarrot rides the gcc job, bench the clang job — matching ci.yml:82,92.
#
# Linux steps run inside the public `ruby` container image (buildpack-deps-based:
# Ruby + gcc + make + curl). The ruby image has no clang, so the clang track
# `apt-get install`s it via .buildkite/ensure-clang — cheap because the container
# runs as root (no sudo). macOS runs natively (its hosted image ships Ruby+clang).
#
# Explicit keyed builds (not a build matrix): a matrix can't set per-combo keys,
# so downstream steps could only depend on the whole matrix — in build #9 one
# failed compiler dragged down tracks that had already passed. Keyed builds let
# each track's tests depend on just their own build and scope the artifact
# download with --step (all builds publish the same two filenames).
#
# Tracks run concurrently on separate queues, so wall-clock ≈ the slowest track,
# not the sum. The remaining tax is hosted cold-start (~10s/phase to provision a
# fresh VM); set a minimum warm-agent count on each queue to beat GHA reliably.
#
# OPT is intentionally NOT set globally: run-tests defaults to -O1 (compiles the
# sp_runtime.h-heavy per-test C ~3x faster), while bench/optcarrot inherit the
# Makefile default -O2 — exactly like ci.yml, which sets OPT=-O1 only on tests.

steps:
  # ===================== macOS / clang (native Ruby) =======================
  - label: ":mac: build"
    key: "build-macos"
    agents:
      queue: "macos"
    command:
      - "make deps"
      - "make -j\"$$(getconf _NPROCESSORS_ONLN)\" LTO=0 all"
      - "make rbs-test rbs-seed-test"
    artifact_paths:
      - "bin/spinel"
      - "lib/libspinel_rt.a"

  - label: ":mac: tests %n"
    key: "tests-macos"
    depends_on: "build-macos"
    agents:
      queue: "macos"
    parallelism: 8
    command:
      - "buildkite-agent artifact download bin/spinel . --step build-macos"
      - "buildkite-agent artifact download lib/libspinel_rt.a . --step build-macos"
      - "chmod +x bin/spinel"
      - ".buildkite/run-tests --slice"

  # ===================== Linux / gcc (image: ruby) — carries optcarrot =====
  - label: ":linux: build (gcc)"
    key: "build-linux-gcc"
    image: "ruby"
    agents:
      queue: "linux"
    env:
      CC: "gcc"
    command:
      - "make deps"
      - "make -j\"$$(getconf _NPROCESSORS_ONLN)\" LTO=0 all"
      - "make rbs-test rbs-seed-test"
    artifact_paths:
      - "bin/spinel"
      - "lib/libspinel_rt.a"

  - label: ":linux: tests gcc %n"
    key: "tests-linux-gcc"
    depends_on: "build-linux-gcc"
    image: "ruby"
    agents:
      queue: "linux"
    env:
      CC: "gcc"
    parallelism: 8
    command:
      - "buildkite-agent artifact download bin/spinel . --step build-linux-gcc"
      - "buildkite-agent artifact download lib/libspinel_rt.a . --step build-linux-gcc"
      - "chmod +x bin/spinel"
      - ".buildkite/run-tests --slice"

  - label: ":linux: optcarrot (gcc)"
    key: "optcarrot"
    depends_on: "build-linux-gcc"
    image: "ruby"
    agents:
      queue: "linux"
    env:
      CC: "gcc"
    command:
      - "buildkite-agent artifact download bin/spinel . --step build-linux-gcc"
      - "buildkite-agent artifact download lib/libspinel_rt.a . --step build-linux-gcc"
      - "chmod +x bin/spinel"
      - "make -o bin/spinel -o lib/libspinel_rt.a optcarrot"

  # ===================== Linux / clang (image: ruby + clang) — carries bench
  - label: ":linux: build (clang)"
    key: "build-linux-clang"
    image: "ruby"
    agents:
      queue: "linux"
    env:
      CC: "clang"
    command:
      - ".buildkite/ensure-clang"
      - "make deps"
      - "make -j\"$$(getconf _NPROCESSORS_ONLN)\" LTO=0 all"
      - "make rbs-test rbs-seed-test"
    artifact_paths:
      - "bin/spinel"
      - "lib/libspinel_rt.a"

  - label: ":linux: tests clang %n"
    key: "tests-linux-clang"
    depends_on: "build-linux-clang"
    image: "ruby"
    agents:
      queue: "linux"
    env:
      CC: "clang"
    parallelism: 8
    command:
      - "buildkite-agent artifact download bin/spinel . --step build-linux-clang"
      - "buildkite-agent artifact download lib/libspinel_rt.a . --step build-linux-clang"
      - "chmod +x bin/spinel"
      - ".buildkite/ensure-clang"
      - ".buildkite/run-tests --slice"

  - label: ":linux: bench (clang) %n"
    key: "bench"
    depends_on: "build-linux-clang"
    image: "ruby"
    agents:
      queue: "linux"
    env:
      CC: "clang"
    # 57 benchmarks run serially took ~64s and was the build's long pole;
    # shard them so the slowest track stops being gated by bench.
    parallelism: 4
    command:
      - "buildkite-agent artifact download bin/spinel . --step build-linux-clang"
      - "buildkite-agent artifact download lib/libspinel_rt.a . --step build-linux-clang"
      - "chmod +x bin/spinel"
      - ".buildkite/ensure-clang"
      - ".buildkite/run-bench --slice"
